# Phase 10 §8.1 生产 Docker Compose
# 启动顺序：frontend-builder → backend（含 alembic upgrade）→ nginx
# 用法：
#   cp .env.prod.example .env.prod
#   编辑 .env.prod 填入真实值
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-quantpilot}
      POSTGRES_USER: ${POSTGRES_USER:-quantpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # 性能调优：默认 shared_buffers=128MB 在 5y 历史数据场景（daily_quote 2M+ 行）
    # 不够，触发 buffer cache 颠簸（hit ratio 78% / 22% disk read）。下列保守值适配
    # WSL2 backend 3.4GB Docker 配额约束：db 总内存 ~1.5GB，留 backend ~1.4GB 余量。
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=1GB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - wal_buffers=16MB
      - -c
      - checkpoint_timeout=15min
      - -c
      - max_wal_size=1GB
      - -c
      - random_page_cost=1.1
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quantpilot}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}
      --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 前端构建容器：生成 dist/ 到共享 volume 后退出（tail -f 保持容器存活供 nginx 读取）
  frontend-builder:
    build:
      context: ./frontend
      dockerfile: Dockerfile.build
    volumes:
      - frontend_dist:/output
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: ${JWT_REFRESH_TOKEN_EXPIRE_DAYS:-7}
      TUSHARE_TOKEN: ${TUSHARE_TOKEN:-}
      WXPUSHER_APP_TOKEN: ${WXPUSHER_APP_TOKEN:-}
      WXPUSHER_UID: ${WXPUSHER_UID:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost"]}
      # 回测护栏（2026-06-15）：超此日历跨度的回测在端点层 422 拒绝（默认 0=不限制）。
      # 必须显式列在 environment 白名单，否则 .env.prod 设了也进不了容器（settings 默认 0）。
      BACKTEST_MAX_WINDOW_DAYS: ${BACKTEST_MAX_WINDOW_DAYS:-0}
      # 回测总开关（2026-06-29 定案）：2GB 机**结构性**跑不了回测——引擎恒加载
      # window + 130d lookback 的 daily_quotes，lookback ≈ 90 交易日是固定地板，
      # 哪怕 1 天窗口也要装 45 万行；30 天回测实测峰值 avail 仅剩 107MB。已因此 OOM
      # 宕机 4 次。false → POST /backtest/run 最前置返 503（连窗口/并发护栏都不到），
      # 长回测走本地算力中心 + POST /backtest/import 回流。
      # 默认取 false 而非 true 是**失效方向**的选择：漏配 .env.prod 时应保持关闭。
      # 补于 2026-08-27——commit 3ffefcb 只改了 .env.prod.example 与 backend 代码，
      # 漏了本白名单（服务器上是就地手改的，从未进 git），仓库与生产就此分叉：
      # 谁按 git 重建一套生产，这个开关就会静默消失、回测重新打开。
      BACKTEST_ENABLED: ${BACKTEST_ENABLED:-false}
      DEBUG: "false"
      LOG_DIR: /app/logs
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_JSON: "true"
      # APScheduler / NotificationService 推送时段均按 Asia/Shanghai 判断
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - backend_logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # 启动时先跑 alembic upgrade head，再拉起 uvicorn（单进程）。
    # APScheduler 使用 in-memory jobstore，多 worker 会让定时任务重复触发，
    # 因此显式保持单进程；单管理员场景吞吐充足。
    command: >
      sh -c "alembic upgrade head &&
             uvicorn quantpilot.main:app --host 0.0.0.0 --port 8000"

  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      # 绑定地址默认 127.0.0.1（**失效方向**）：本套生产的 HTTPS 走宿主上的
      # Cloudflare Tunnel 回源到 localhost，nginx 不需要、也不应该监听公网。
      # 2026-08-31 仓库↔服务器对账发现：服务器上早已是 `127.0.0.1:`（就地手改，
      # 从未回写 git），而仓库这份是裸 `${HTTP_PORT}:80` → **谁按 git 重建一套
      # 生产，nginx 就会绑到所有网卡、绕过 Tunnel 直接暴露**。与 BACKTEST_ENABLED
      # 同一个成因（运维红线②：服务器就地改过的配置必须回写仓库）。
      # 确需公网监听（无 Tunnel 的独立部署）时在 .env.prod 显式设 HTTP_BIND=0.0.0.0。
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-80}:80"
      # 启用 HTTPS 时取消注释
      # - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - frontend_dist:/usr/share/nginx/html:ro
      - nginx_logs:/var/log/nginx
      # - ./nginx/ssl:/etc/nginx/ssl:ro  # 启用 HTTPS 时取消注释
    depends_on:
      - backend
      - frontend-builder

volumes:
  pg_data:
  redis_data:
  frontend_dist:
  backend_logs:
  nginx_logs:
